# =============================================================================
# MambaIRv2 LLIE+SR Training Config (x4 upscale)
# Joint Low-Light Enhancement + Super-Resolution on RELLISUR dataset
# =============================================================================

name: MambaIRv2_LLIESR_x4
model_type: MambaIRv2LLIESRModel
scale: 4
num_gpu: 1
manual_seed: 10

# -----------------------------------------------------------------------------
# Dataset
# -----------------------------------------------------------------------------
datasets:
  train:
    task: SR
    name: RELLISUR_Train
    type: PairedImageDataset
    dataroot_gt:
      - datasets/RELLISUR-Dataset/Train/NLHR-Duplicates/X4
    dataroot_lq:
      - datasets/RELLISUR-Dataset/Train/LLLR
    io_backend:
      type: disk

    # Illumination guidance: computes IG(L_g) = A(L_g) + B(L_g) at load time
    # Returns 'gray' [2, H, W] key in data dict
    use_illguidance: true

    gt_size: 192
    use_hflip: true
    use_rot: true

    # Data loader
    use_shuffle: true
    num_worker_per_gpu: 8
    batch_size_per_gpu: 8
    dataset_enlarge_ratio: 100
    prefetch_mode: ~

  val:
    name: RELLISUR_Val
    type: PairedImageDataset
    dataroot_gt: datasets/RELLISUR-Dataset/Val/NLHR-Duplicates/X4
    dataroot_lq: datasets/RELLISUR-Dataset/Val/LLLR
    use_illguidance: true
    io_backend:
      type: disk

# -----------------------------------------------------------------------------
# Network Architecture
# -----------------------------------------------------------------------------
network_g:
  type: MambaIRv2LLIESR
  upscale: 4
  in_chans: 3
  img_size: 64
  img_range: 1.
  embed_dim: 48
  d_state: 8
  depths: [ 5, 5, 5, 5 ]
  num_heads: [ 4, 4, 4, 4 ]
  window_size: 16
  inner_rank: 32
  num_tokens: 64
  convffn_kernel_size: 5
  mlp_ratio: 1.0
  upsampler: 'pixelshuffledirect'
  resi_connection: '1conv'
  # LLIE+SR specific
  igm_n_feat: 48
  isdm_num_heads: 2
  isdm_ffn_expansion: 2.66

# -----------------------------------------------------------------------------
# Paths
# -----------------------------------------------------------------------------
path:
  pretrain_network_g: ~
  strict_load_g: false
  resume_state: ~

# -----------------------------------------------------------------------------
# Training Settings
# -----------------------------------------------------------------------------
train:
  optim_g:
    type: Adam
    lr: !!float 2e-4
    weight_decay: 0
    betas: [ 0.9, 0.99 ]

  scheduler:
    type: MultiStepLR
    milestones: [ 250000, 400000, 450000, 475000 ]
    gamma: 0.5

  total_iter: 500000
  warmup_iter: -1

  # ---------------------------------------------------------------------------
  # Loss Functions
  # L_total = L_rec + λ_perc*L_perc + λ_ssim*L_ssim + λ_light*L_light + λ_tv*L_tv
  # ---------------------------------------------------------------------------

  # Loss 1: Pixel loss (L_rec = ||pred - gt||_1)
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean

  # Loss 2: Perceptual loss (VGG19 feature matching)
  # Weights from UltraIS: conv1_2=0.1, conv2_2=0.1, conv3_4=1, conv4_4=1, conv5_4=1
  # perceptual_opt:
  #   type: PerceptualLoss
  #   layer_weights:
  #     'conv1_2': 0.1
  #     'conv2_2': 0.1
  #     'conv3_4': 1
  #     'conv4_4': 1
  #     'conv5_4': 1
  #   vgg_type: vgg19
  #   use_input_norm: true
  #   perceptual_weight: !!float 1.0
  #   style_weight: 0
  #   range_norm: false
  #   criterion: l1

  # # Loss 3: SSIM loss (L_ssim = 1 - SSIM(pred, gt))
  # ssim_opt:
  #   type: SSIMLoss
  #   window_size: 11
  #   loss_weight: !!float 0.1

  # # Loss 4: Illumination loss (L_light = ||Y(pred) - Y(gt)||_1)
  # illumination_opt:
  #   type: IlluminationLoss
  #   loss_weight: !!float 1.0
  #   reduction: mean

  # # Loss 5: Total Variation loss (L_tv for spatial smoothness)
  # tv_opt:
  #   type: TotalVariationLoss
  #   loss_weight: !!float 0.01

# -----------------------------------------------------------------------------
# Validation Settings
# -----------------------------------------------------------------------------
val:
  val_freq: !!float 5e3
  save_img: true

  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 4
      test_y_channel: true

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
logger:
  print_freq: 200
  save_checkpoint_freq: !!float 5e3
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

# -----------------------------------------------------------------------------
# Distributed Training
# -----------------------------------------------------------------------------
dist_params:
  backend: nccl
  port: 29500
