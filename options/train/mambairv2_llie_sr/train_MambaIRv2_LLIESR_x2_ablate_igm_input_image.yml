# =============================================================================
# MambaIRv2 LLIE+SR Training Config (x2 upscale)
# Ablation A4: No Mini-ASPP + IGM uses input image instead of illumination guidance
# =============================================================================

name: MambaIRv2_LLIESR_x2_A4_IGMInputImage
model_type: MambaIRv2LLIESRModel
scale: 2
num_gpu: 1
manual_seed: 10

datasets:
  train:
    task: SR
    name: RELLISUR_Train
    type: PairedImageDataset
    dataroot_gt: datasets/RELLISUR-Dataset/Train/NLHR/X2
    dataroot_lq: datasets/RELLISUR-Dataset/Train/LLLR
    direct_gt_match: true
    io_backend:
      type: disk
    use_illguidance: false
    gt_size: 128
    use_hflip: true
    use_rot: true
    use_shuffle: true
    num_worker_per_gpu: 8
    batch_size_per_gpu: 8
    dataset_enlarge_ratio: 100
    prefetch_mode: ~

  val:
    name: RELLISUR_Val
    type: PairedImageDataset
    dataroot_gt: datasets/RELLISUR-Dataset/Val/NLHR/X2
    dataroot_lq: datasets/RELLISUR-Dataset/Val/LLLR
    direct_gt_match: true
    meta_info_file: datasets/RELLISUR-Dataset/meta_info_RELLISUR_val_quick_X2.txt
    use_illguidance: false
    io_backend:
      type: disk

network_g:
  type: MambaIRv2LLIESR
  upscale: 2
  in_chans: 3
  img_size: 64
  img_range: 1.
  embed_dim: 48
  d_state: 8
  depths: [ 5, 5, 5, 5 ]
  num_heads: [ 4, 4, 4, 4 ]
  window_size: 16
  inner_rank: 32
  num_tokens: 64
  convffn_kernel_size: 5
  mlp_ratio: 1.0
  upsampler: 'pixelshuffledirect'
  resi_connection: '1conv'
  igm_n_feat: 48
  isdm_num_heads: 2
  isdm_ffn_expansion: 2.66
  igm_input_type: image
  ablate_igm: false
  ablate_mini_aspp: true
  ablate_isdm: false

path:
  pretrain_network_g: ~
  strict_load_g: false
  resume_state: ~

train:
  optim_g:
    type: Adam
    lr: !!float 2e-4
    weight_decay: 0
    betas: [ 0.9, 0.99 ]

  scheduler:
    type: MultiStepLR
    milestones: [ 50000, 75000, 90000, 95000 ]
    gamma: 0.5

  total_iter: 100000
  warmup_iter: -1
  backbone_lr_scale: ~

  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean

  perceptual_opt:
    type: PerceptualLoss
    layer_weights:
      'conv1_2': 0.1
      'conv2_2': 0.1
      'conv3_4': 1
      'conv4_4': 1
      'conv5_4': 1
    vgg_type: vgg19
    use_input_norm: true
    perceptual_weight: !!float 1.0
    style_weight: 0
    range_norm: false
    criterion: l1

  ssim_opt:
    type: SSIMLoss
    window_size: 11
    loss_weight: !!float 0.1

  illumination_opt:
    type: IlluminationLoss
    loss_weight: !!float 1.0
    reduction: mean

  tv_opt:
    type: TotalVariationLoss
    loss_weight: !!float 0.01

val:
  val_freq: !!float 5e3
  save_img: false

  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 2
      test_y_channel: true
    ssim:
      type: calculate_ssim
      crop_border: 2
      test_y_channel: true

logger:
  print_freq: 200
  save_checkpoint_freq: !!float 5e3
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

dist_params:
  backend: nccl
  port: 29500
